[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fantraxapi"
dynamic = ["version"]
description = "Fantrax API client plus a SofaScore lineup-ingestion and player-mapping pipeline"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
	"requests>=2.31",
	"httpx>=0.25",
	"python-dateutil>=2.8.2",
	"tenacity>=8.0",
	"pytz>=2023.3",
	"pydantic>=2.0",
	"pandas>=2.0",
	"pyarrow>=14",
	"PyYAML>=6.0",
	"unidecode>=1.3",
	"rapidfuzz>=3.0",
]

[project.optional-dependencies]
scrapers = ["beautifulsoup4>=4.12", "requests-cache>=1.1"]
pipelines = ["fantraxapi[scrapers]", "thefuzz>=0.22", "EasySoccerData", "playwright", "rich>=13"]
apps = ["streamlit>=1.31", "selenium>=4.20", "webdriver-manager>=4.0.1", "certifi"]
dev = ["fantraxapi[scrapers]", "pytest", "pytest-asyncio", "pytest-cov", "python-dotenv", "ruff"]

[project.urls]
Source = "https://github.com/ds-oliver/FantraxAPI"
Upstream = "https://github.com/meisnate12/FantraxAPI"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["fantraxapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: hits real Fantrax/SofaScore endpoints (opt in with -m live)"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs", "scripts/manual_checks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E402", "F841"]
